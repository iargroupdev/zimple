name: Build ZimpleTesting installer

on:
  push:
    branches:
      - codex/zimpletesting-production-test
    paths-ignore:
      - 'artifacts/**'
    tags:
      - zimpletesting-production-test-*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Publish ClickOnce installer
        run: >
          msbuild ZimpleTesting.sln
          "/t:Clean;Publish"
          /p:Configuration=Release
          /p:Platform="Any CPU"
          /p:PublishDir="${{ github.workspace }}\artifacts\ZimpleTesting_installer\"
          /p:PublishUrl="${{ github.workspace }}\artifacts\ZimpleTesting_installer\"
          /p:InstallUrl="${{ github.workspace }}\artifacts\ZimpleTesting_installer\"
          /p:UpdateEnabled=false
          /m
          /v:m

      - name: Zip installer
        shell: pwsh
        run: |
          $zipPath = "${{ github.workspace }}\artifacts\ZimpleTesting_installer_20260924.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "${{ github.workspace }}\artifacts\ZimpleTesting_installer\*" -DestinationPath $zipPath

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZimpleTesting_installer
          path: artifacts/ZimpleTesting_installer

      - name: Commit installer zip
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/ZimpleTesting_installer_20260924.zip
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Installer zip unchanged; nothing to commit."
            exit 0
          }
          git commit -m "Add latest ZimpleTesting installer [skip ci]"
          git push
